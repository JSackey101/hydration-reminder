<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hydration Reminder Settings</title>
    <link rel="stylesheet" href="/src/settings.css" />
    <script type="module" src="/src/settings.ts"></script>
  </head>
  <body>
    <main>
      <h1>Settings</h1>
      <div class="row">
        <label for="interval">Remind me every</label>
        <input id="interval" type="number" min="1" max="240" step="1" required disabled />
        <span>minutes</span>
      </div>
      <div class="row">
        <input id="timeout-on" type="checkbox" disabled />
        <label for="timeout-on">Close an unanswered popup after</label>
        <input id="timeout" type="number" min="1" max="60" step="1" aria-label="Popup timeout in minutes" disabled />
        <span>min</span>
      </div>
      <div class="row" role="radiogroup" aria-labelledby="style-name">
        <span id="style-name">Reminder style</span>
        <input id="style-popup" name="style" type="radio" value="popup" disabled />
        <label for="style-popup">Popup</label>
        <input id="style-drop" name="style" type="radio" value="drop" disabled />
        <label for="style-drop">Small drop</label>
      </div>
      <div class="row">
        <input id="login" type="checkbox" disabled />
        <label for="login">Start at login</label>
      </div>
      <h2>Shortcuts</h2>
      <div class="row shortcut">
        <span class="name" id="drank-name">Drank</span>
        <kbd id="drank-key"></kbd>
        <button id="drank-record" type="button" aria-describedby="drank-name drank-key" disabled>Record</button>
      </div>
      <div class="row shortcut">
        <span class="name" id="snooze-name">Snooze</span>
        <kbd id="snooze-key"></kbd>
        <button id="snooze-record" type="button" aria-describedby="snooze-name snooze-key" disabled>Record</button>
      </div>
      <p id="shortcut-status" class="status" role="status" aria-live="polite"></p>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
