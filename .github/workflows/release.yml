name: Release

# Builds unsigned installers: a universal macOS .dmg and Windows .msi/.exe.
# - Push a tag like v0.1.0: the installers go into a draft GitHub Release.
# - "Run workflow" (manual), or a PR that changes the packaging: the
#   installers are kept as workflow artifacts and nothing is released.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - src-tauri/tauri.conf.json
      - src-tauri/Cargo.toml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the app version
        if: github.event_name == 'push'
        shell: bash
        run: |
          tauri=$(node -p "require('./src-tauri/tauri.conf.json').version")
          npm=$(node -p "require('./package.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)
          for v in "$tauri" "$npm" "$cargo"; do
            if [ "$GITHUB_REF_NAME" != "v$v" ]; then
              echo "Tag $GITHUB_REF_NAME doesn't match the versions: tauri.conf.json $tauri, package.json $npm, Cargo.toml $cargo" >&2
              exit 1
            fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Unit tests
        working-directory: src-tauri
        run: cargo test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # Empty unless this run is a tag push, so nothing else is released.
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: Hydration Reminder ${{ github.ref_name }}
          releaseBody: Unsigned builds. See the README's Install section for how to open them.
          releaseDraft: true
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push'
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
